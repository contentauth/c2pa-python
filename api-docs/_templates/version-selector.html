<div class="sidebar-tree">
  <select id="docs-version" aria-label="Documentation version">
    {% for item in docs_versions %}
    <option value="{{ item.url | e }}"{% if item.tag == docs_tag %} selected{% endif %}>{{ item.tag | e }}</option>
    {% endfor %}
  </select>
  <noscript>
    <ul>
      {% for item in docs_versions %}
      <li><a href="{{ item.url | e }}">{{ item.tag | e }}</a></li>
      {% endfor %}
    </ul>
  </noscript>
</div>
