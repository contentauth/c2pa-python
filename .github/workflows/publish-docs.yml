name: Build and publish docs

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

# Do not queue promotions in a concurrency group: GitHub discards pending runs.
jobs:
  promote:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Require dedicated documentation App
        env:
          APP_ID: ${{ vars.C2PA_DOCS_APP_ID }}
          APP_KEY: ${{ secrets.C2PA_DOCS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo "::error::Configure C2PA_DOCS_APP_ID and C2PA_DOCS_APP_PRIVATE_KEY for the repository-scoped docs App; no workflow-token fallback is permitted."
            exit 1
          fi
      - name: Mint manifest writer token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.C2PA_DOCS_APP_ID }}
          private-key: ${{ secrets.C2PA_DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Verify and promote stable release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_WRITE_TOKEN: ${{ steps.app.outputs.token }}
        run: python scripts/promote_docs_release.py
